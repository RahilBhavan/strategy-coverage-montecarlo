<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-labelledby="t d" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title id="t">How the simulation finds each funding tier's first failure week</title>
<desc id="d">Method diagram in four steps: frozen inputs, 20,000 simulated weekly paths per case, three funding tiers paying the same charges on the same paths, and a readout of the share of paths that have failed within 1, 3 and 5 years. It states no result probabilities.</desc>
<rect width="1000" height="500" fill="#F5F5EF"/>
<text x="32" y="50" font-size="28" font-weight="700" fill="#111214">How each funding tier's first failure week is found</text>
<text x="32" y="80" font-size="16" fill="#52545A">The same simulated paths feed all three tiers. This figure shows the method and states no result probabilities.</text>
<rect x="32" y="118" width="205" height="280" fill="none" stroke="#111214" stroke-width="2"/>
<rect x="32" y="118" width="205" height="38" fill="#111214"/>
<text x="46" y="144" font-size="18" font-weight="700" fill="#F5F5EF">1  Frozen inputs</text>
<text x="46" y="186" font-size="16" fill="#111214">Snapshot of 2026-10-21:</text>
<text x="46" y="210" font-size="16" fill="#111214">SEC filings, issuer</text>
<text x="46" y="234" font-size="16" fill="#111214">releases, market prices.</text>
<text x="46" y="258" font-size="16" fill="#111214">BTC history to</text>
<text x="46" y="282" font-size="16" fill="#111214">2026-10-20 sets</text>
<text x="46" y="306" font-size="16" fill="#111214">volatility.</text>
<path d="M241 243 H265 M257 236 L267 243 L257 250" fill="none" stroke="#111214" stroke-width="2"/>
<rect x="273" y="118" width="205" height="280" fill="none" stroke="#111214" stroke-width="2"/>
<rect x="273" y="118" width="205" height="38" fill="#111214"/>
<text x="287" y="144" font-size="18" font-weight="700" fill="#F5F5EF">2  Weekly paths</text>
<text x="287" y="186" font-size="16" fill="#111214">20,000 paths per case,</text>
<text x="287" y="210" font-size="16" fill="#111214">seed 20261021.</text>
<text x="287" y="234" font-size="16" fill="#111214">BTC price, mNAV,</text>
<text x="287" y="258" font-size="16" fill="#111214">MSTR volume and</text>
<text x="287" y="282" font-size="16" fill="#111214">EUR/USD move together.</text>
<text x="287" y="306" font-size="16" fill="#111214">BTC: lognormal or</text>
<text x="287" y="330" font-size="16" fill="#111214">block bootstrap.</text>
<path d="M482 243 H506 M498 236 L508 243 L498 250" fill="none" stroke="#111214" stroke-width="2"/>
<rect x="514" y="118" width="205" height="280" fill="none" stroke="#111214" stroke-width="2"/>
<rect x="514" y="118" width="205" height="38" fill="#FFE500"/>
<text x="528" y="144" font-size="18" font-weight="700" fill="#111214">3  Three tiers</text>
<rect x="528" y="172" width="177" height="50" fill="none" stroke="#C6C7BF" stroke-width="2"/>
<text x="538" y="194" font-size="16" font-weight="700" fill="#111214">Tier a</text>
<text x="538" y="214" font-size="15" fill="#52545A">USD reserve only</text>
<rect x="528" y="234" width="177" height="50" fill="none" stroke="#C6C7BF" stroke-width="2"/>
<text x="538" y="256" font-size="16" font-weight="700" fill="#111214">Tier b</text>
<text x="538" y="276" font-size="15" fill="#52545A">a + common ATM sales</text>
<rect x="528" y="296" width="177" height="50" fill="none" stroke="#C6C7BF" stroke-width="2"/>
<text x="538" y="318" font-size="16" font-weight="700" fill="#111214">Tier c</text>
<text x="538" y="338" font-size="15" fill="#52545A">b + BTC sales</text>
<path d="M723 243 H747 M739 236 L749 243 L739 250" fill="none" stroke="#111214" stroke-width="2"/>
<rect x="755" y="118" width="205" height="280" fill="none" stroke="#111214" stroke-width="2"/>
<rect x="755" y="118" width="205" height="38" fill="#111214"/>
<text x="769" y="144" font-size="18" font-weight="700" fill="#F5F5EF">4  Readout</text>
<text x="769" y="186" font-size="16" fill="#111214">Each tier fails in the</text>
<text x="769" y="210" font-size="16" fill="#111214">first week its sources</text>
<text x="769" y="234" font-size="16" fill="#111214">cannot pay that week's</text>
<text x="769" y="258" font-size="16" fill="#111214">charges. Unpaid amounts</text>
<text x="769" y="282" font-size="16" fill="#111214">accumulate; the path</text>
<text x="769" y="306" font-size="16" fill="#111214">continues.</text>
<text x="769" y="330" font-size="16" fill="#111214">Count paths that failed</text>
<text x="769" y="354" font-size="16" fill="#111214">within 1, 3 and 5 years,</text>
<text x="769" y="378" font-size="16" fill="#111214">with a binomial SE.</text>
<text x="32" y="438" font-size="15" fill="#52545A">Charges: preferred dividends, convertible interest and, in the principal cases, note principal. Paths still funded at 20 years are censored.</text>
<text x="32" y="462" font-size="15" fill="#52545A">Conditional scenarios on assumed inputs, not forecasts. Method: docs/methodology.md. Independent research.</text>
</svg>
